services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: prophet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: prophet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./web/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prophet"]
      interval: 5s
      retries: 10

  web:
    build: ./web
    pull_policy: build   # `docker compose up -d` sempre reconstrói a partir do código local
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment: &app-env
      DATABASE_URL: postgres://prophet:${POSTGRES_PASSWORD}@db:5432/prophet
      SESSION_SECRET: ${SESSION_SECRET:?defina no .env}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      QUOTES_URL: http://quotes:8000

  worker:
    build: ./web
    pull_policy: build   # `docker compose up -d` sempre reconstrói a partir do código local
    command: ["npx", "tsx", "src/worker/index.ts"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment: *app-env

  # Preço real via yfinance (Yahoo). Sem porta publicada: só o web acessa, pela rede do Compose.
  quotes:
    build: ./quotes
    pull_policy: build   # `docker compose up -d` sempre reconstrói a partir do código local
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
